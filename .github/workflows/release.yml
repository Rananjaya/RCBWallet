name: Release

# Publishes a signed GitHub Release after a push to main (with branch
# protection on, that means a merged pull request), once a reviewer approves
# the `production` environment.
#
# Two jobs:
#   validate  No secrets. Analyze, test, version check, and refuse to overwrite
#             an existing release. Failing here publishes nothing and never
#             asks for approval.
#   release   Runs only after `validate` passes, in the protected `production`
#             environment: GitHub waits for a required reviewer before this job
#             starts, and only then can it read the signing secrets. It builds
#             the signed APK, verifies the signing certificate, tags vX.Y.Z,
#             publishes the GitHub Release with a SHA-256 checksum, and always
#             deletes the signing files.
#
# Any failure before "Create tag" publishes nothing.

on:
  push:
    branches: [main]

permissions:
  contents: read

# No `concurrency:` group on purpose. GitHub keeps only one pending run per
# group and cancels older pending ones, which would silently skip versions.
# Instead, the release job first waits for every earlier run of this workflow
# to finish (FIFO by run number), so each merged version gets its own release,
# in merge order. Tags are pushed without --force, so two runs can never
# overwrite each other's tag.

env:
  FLUTTER_VERSION: '3.47.9'
  APP_ID: com.rananjaya.rcbwallet

jobs:
  validate:
    name: Validate release
    # Never release from forks or other branches.
    if: github.repository == 'Rananjaya/RCBWallet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout merged commit with tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Validate semantic version
        id: version
        run: bash tool/ci/check_version.sh --mode release

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error title=Release exists::Release $TAG already exists; bump the version in pubspec.yaml."
            exit 1
          fi
          echo "No release for $TAG yet."

  release:
    name: Build and publish release
    needs: validate
    if: github.repository == 'Rananjaya/RCBWallet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Requires approval by a reviewer configured on the environment (see
    # RELEASE.md). The signing secrets and RELEASE_CERT_SHA256 live here.
    environment: production
    # Includes time spent waiting for earlier release runs.
    timeout-minutes: 120
    permissions:
      contents: write # create the tag and the GitHub Release
      actions: read   # list earlier runs of this workflow (merge-order queue)
    steps:
      - name: Wait for earlier release runs (merge order)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Run numbers increase in the order pushes reach main. Wait until no
          # earlier run of this workflow is still queued, waiting or running.
          deadline=$((SECONDS + 75 * 60))
          while true; do
            if earlier="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?per_page=100" \
                --jq "[.workflow_runs[] | select(.status != \"completed\" and .run_number < $GITHUB_RUN_NUMBER) | .run_number] | map(tostring) | join(\" \")")"; then
              if [ -z "$earlier" ]; then
                echo "No earlier release runs pending; continuing as run #$GITHUB_RUN_NUMBER."
                break
              fi
              echo "Waiting for earlier release run(s): #${earlier// / #}"
            else
              echo "Could not list workflow runs; retrying."
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=Release queue timeout::Earlier release runs still pending after 75 minutes; approve, reject or cancel them, then re-run this job."
              exit 1
            fi
            sleep 30
          done

      - name: Checkout merged commit with tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Repeat the version checks: tags or releases may have changed while this
      # job waited for approval.
      - name: Re-validate version
        id: version
        run: bash tool/ci/check_version.sh --mode release

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error title=Release exists::Release $TAG already exists; bump the version in pubspec.yaml."
            exit 1
          fi
          echo "No release for $TAG yet."

      - name: Check expected release certificate
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          cert="$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          if [[ ! "$cert" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=Release certificate missing::Set the RELEASE_CERT_SHA256 variable on the production environment to the release certificate's SHA-256 (see RELEASE.md)."
            exit 1
          fi
          echo "Expected release certificate SHA-256: $cert"

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Install Android SDK packages (API 37)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
          echo "Installed platforms;android-37.0 and build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Set up release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Signing secrets missing::Configure these production environment secrets:$missing (see RELEASE.md)"
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/rcbwallet-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          [ -s "$keystore" ] || { echo "::error::Decoded keystore is empty"; exit 1; }
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "$keystore"
          } > android/key.properties
          echo "Signing configured (keystore in runner temp, key.properties generated)."

      # android/app/build.gradle.kts validates key.properties and the keystore
      # (:app:validateReleaseSigning) and never falls back to the debug key.
      - name: Build signed release APK
        run: flutter build apk --release

      - name: Verify APK (package, version, permissions, signing certificate)
        env:
          EXPECTED_VERSION_NAME: ${{ steps.version.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.build }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          # Release mode: no INTERNET permission, and exactly one valid signer
          # whose certificate SHA-256 equals RELEASE_CERT_SHA256.
          bash tool/ci/verify_apk.sh --mode release \
            build/app/outputs/flutter-apk/app-release.apk "$APP_ID" "$RELEASE_CERT_SHA256"

      - name: Prepare release assets
        id: assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          apk="RCBWallet-$VERSION-release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$apk"
          (cd dist && sha256sum "$apk" > "$apk.sha256" && cat "$apk.sha256")
          echo "apk=dist/$apk" >> "$GITHUB_OUTPUT"
          echo "sha=dist/$apk.sha256" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.version.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Without --force, the push fails if the tag already exists on GitHub.
          git push origin "$GITHUB_SHA:refs/tags/$TAG"
          echo "Created tag $TAG at $GITHUB_SHA"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          APK: ${{ steps.assets.outputs.apk }}
          SHA_FILE: ${{ steps.assets.outputs.sha }}
        run: |
          gh release create "$TAG" "$APK" "$SHA_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "RCBWallet $VERSION" \
            --notes "RCBWallet $VERSION (build $BUILD). Signed release APK and SHA-256 checksum attached." \
            --generate-notes

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/rcbwallet-release.jks" android/key.properties
          echo "Signing files removed."
