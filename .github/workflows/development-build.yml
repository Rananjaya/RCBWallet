name: Development build

# Downloadable debug APKs for development and QA testing.
#
# - Runs on pushes to feature/** branches, or manually for any branch.
# - Read-only, no signing secrets. Nothing is published or tagged.
# - Debug APKs are signed with the runner's own temporary debug key, which is
#   different on every run. Uninstall the previous development build before
#   installing a newer one (this deletes its app data).
# - Debug APKs request INTERNET for Flutter development tools. Test them with
#   dummy data only. Never store real card details in a development build.

on:
  push:
    branches: ['feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'
  APP_ID: com.rananjaya.rcbwallet

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Install Android SDK packages (API 37)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
          echo "Installed platforms;android-37.0 and build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Prepare artifact
        id: artifact
        run: |
          raw="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d "[:space:]\"'")"
          version="${raw%%+*}"
          short_sha="${GITHUB_SHA::7}"
          name="RCBWallet-$version-$short_sha-debug"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk "dist/$name.apk"
          (cd dist && sha256sum "$name.apk" > "$name.apk.sha256" && cat "$name.apk.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Check package ID
        run: |
          bt="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)"
          pkg="$("$bt/aapt2" dump badging "dist/${{ steps.artifact.outputs.name }}.apk" \
            | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          [ "$pkg" = "$APP_ID" ] || { echo "::error::package is '$pkg', expected '$APP_ID'"; exit 1; }
          echo "OK: package $pkg"

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
