name: CI

# Pull request validation for main, plus quick feedback on feature branches.
# Uses the plain `pull_request` trigger (never `pull_request_target`) and has no
# access to signing secrets, so pull requests from forks can't reach them.
# Nothing is published from this workflow.

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Flutter version the test baseline is verified with. Bump deliberately.
  FLUTTER_VERSION: '3.47.9'
  APP_ID: com.rananjaya.rcbwallet

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  version-check:
    name: Version check
    # Only meaningful for pull requests into main. Skipped jobs count as passing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code with tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Validate semantic version
        run: bash tool/ci/check_version.sh --mode pr

      - name: Test version check script
        run: bash tool/ci/tests/check_version_test.sh

  release-build-check:
    name: Release build check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Install Android SDK packages (API 37)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;36.0.0" >/dev/null
          echo "Installed platforms;android-37.0 and build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # No signing secrets here. RCBWallet never falls back to the debug key, so
      # this builds an UNSIGNED release APK (only :app:validateReleaseSigning is
      # skipped). The APK is a compile check and is never uploaded.
      - name: Build release APK (unsigned validation build)
        id: build
        run: bash tool/ci/build_unsigned_release.sh

      # Structure mode: package ID, version name/code and no INTERNET
      # permission. Signatures aren't checked here; the release workflow checks
      # them in release mode.
      - name: Verify APK structure (package, version, permissions)
        env:
          APK: ${{ steps.build.outputs.apk }}
        run: |
          raw="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d "[:space:]\"'")"
          export EXPECTED_VERSION_NAME="${raw%%+*}" EXPECTED_VERSION_CODE="${raw##*+}"
          bash tool/ci/verify_apk.sh --mode structure "$APK" "$APP_ID"

      # Self-tests for verify_apk.sh, using throwaway keys generated in the
      # test. The debug APK (which requests INTERNET for Flutter tooling) is
      # the negative sample for the INTERNET check.
      - name: Build debug APK (negative sample for the INTERNET check)
        run: flutter build apk --debug

      - name: Test APK verification script
        env:
          APK: ${{ steps.build.outputs.apk }}
        run: bash tool/ci/tests/verify_apk_test.sh "$APK" build/app/outputs/flutter-apk/app-debug.apk
