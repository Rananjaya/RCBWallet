name: wallet
description: "RCBWallet - an independently maintained fork of Wallet by
  Sidhant (https://github.com/sidhant947/Wallet). Stores card information
  locally on the device in encrypted form, with no internet permission in
  release builds."
publish_to: "none"
# RCBWallet versioning (independent of upstream): MAJOR.MINOR.PATCH+BUILD
#   MAJOR = breaking changes, MINOR = backward-compatible features,
#   PATCH = bug fixes, BUILD = Android versionCode (must increase on every
#   distributed release). Upstream Wallet was at 1.0.42+45 when forked.
version: 1.0.1+2

environment:
  sdk: ^3.10.4
  flutter: ^3.44.7

dependencies:
  archive: ^4.0.9
  barcode_scan2: ^4.4.0
  barcode_widget: ^2.0.4
  cryptography_plus: ^3.0.0
  crypto: ^3.0.5
  encrypt: ^5.0.3
  file_picker: ^10.3.2
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  flutter_slidable: ^4.0.0
  image_picker: ^1.2.0
  local_auth: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  url_launcher: ^6.3.1
  zxing_lib: ^1.1.4
  image: ^4.8.0
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/network/

  fonts:
    - family: ZSpace
      fonts:
        - asset: assets/fonts/SpaceGrotesk-VariableFont_wght.ttf
